<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 300px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        color: #333;
      }
      h3 {
        font-size: 14px;
        margin-bottom: 12px;
        color: #fe2c55;
      }
      label {
        display: block;
        font-weight: 500;
        margin-bottom: 4px;
        margin-top: 10px;
      }
      input {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 12px;
      }
      input:focus {
        outline: none;
        border-color: #fe2c55;
      }
      button {
        margin-top: 14px;
        width: 100%;
        padding: 8px;
        background: #fe2c55;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
      #status {
        margin-top: 8px;
        font-size: 11px;
        color: #666;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h3>Cấu hình Telegram</h3>

    <label for="botToken">Bot Token</label>
    <input type="text" id="botToken" placeholder="123456:ABC-DEF..." />

    <label for="chatId">Chat ID người nhận</label>
    <input type="text" id="chatId" placeholder="-1001234567890" />

    <button id="saveBtn">Lưu cấu hình</button>
    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
